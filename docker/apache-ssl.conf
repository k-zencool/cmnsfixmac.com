# Local dev HTTPS vhost — mirrors 000-default.conf on port 443.
# Needed because Safari/Chrome only expose camera + microphone (getUserMedia)
# on a secure context, so /tester/camera-tester and /tester/microphone-tester
# cannot be tested from a phone over plain http://<lan-ip>:8000.
# Cert is mounted at runtime from ./docker/certs (see docker-compose.yml) and is
# generated by mkcert — it is NEVER baked into the image and never leaves dev.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/apache2/certs/dev-cert.pem
    SSLCertificateKeyFile /etc/apache2/certs/dev-key.pem

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ssl-access.log combined
</VirtualHost>
</IfModule>
