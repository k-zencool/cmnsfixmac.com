services:
  # เว็บเซิร์ฟเวอร์ (สร้างจาก Dockerfile ของเรา)
  web:
    build: .
    container_name: cmns-web
    ports:
      - "8000:80"
      # 8443 คือของโปรเจกต์ aitest อยู่แล้ว เลยใช้ 8444
      - "8444:443"
    volumes:
      - ./:/var/www/html/
      # mkcert dev cert — gitignored, dev only, never shipped to prod
      - ./docker/certs:/etc/apache2/certs:ro
    environment:
      # override DB_HOST only inside Docker; .env still holds 127.0.0.1 for the real host
      DB_HOST: db
    depends_on:
      - db

  # Database Server (MySQL) — creds come from the shared .env
  db:
    image: mysql:8.0
    container_name: cmns-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cmns-pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
